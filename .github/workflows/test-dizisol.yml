name: Test DIZISOL provider

on:
  push:
    branches:
      - dizisol-provider
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DIZISOL branch
        uses: actions/checkout@v4
        with:
          ref: dizisol-provider
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew make
      - name: Prepare direct-download package
        run: |
          mkdir -p release
          cp ExampleProvider/build/*.cs3 release/DIZISOL.cs3
      - name: Upload CS3 package
        uses: actions/upload-artifact@v4
        with:
          name: dizisol-provider-cs3
          path: release/DIZISOL.cs3
          if-no-files-found: error
      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dizisol-build-${{ github.run_number }}
          name: DIZISOL CloudStream Provider ${{ github.run_number }}
          files: release/DIZISOL.cs3
          generate_release_notes: false
