
name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old packages
        run: rm -f "$GITHUB_WORKSPACE"/builds/*.cs3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build plugins and metadata
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Copy generated files
        run: |
          find "$GITHUB_WORKSPACE/src" \
            -type f -name "*.cs3" -path "*/build/*" \
            -exec cp {} "$GITHUB_WORKSPACE/builds/" \;

          cp "$GITHUB_WORKSPACE/src/build/plugins.json" \
             "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Publish builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Build $GITHUB_SHA"
            git push origin HEAD:builds
          else
            echo "No changes to publish."
          fi
